<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Trạm AI – TikTok callback</title>
<style>body{font-family:system-ui,sans-serif;max-width:720px;margin:40px auto;padding:0 16px;line-height:1.6;color:#222;background:#fff}textarea{width:100%;height:120px;font:13px monospace;box-sizing:border-box}button{margin-top:8px;padding:8px 16px;font-size:15px;cursor:pointer}.err{color:#b3261e}</style></head><body>
<h1>Trạm AI – Đăng nhập TikTok</h1>
<p id="msg">Copy toàn bộ URL bên dưới và dán lại cho Claude Code.</p>
<textarea id="u" readonly></textarea><br><button id="b">Copy</button>
<p>Trang này không gửi dữ liệu đi đâu; mã chỉ hiển thị trên trình duyệt của bạn.</p>
<script>
var u=document.getElementById('u');u.value=location.href;
var q=new URLSearchParams(location.search);
if(q.get('error')){var m=document.getElementById('msg');m.className='err';m.textContent='Lỗi: '+q.get('error')+' – '+(q.get('error_description')||'');}
else if(!q.get('code')){document.getElementById('msg').textContent='Không có mã code trong URL.';}
document.getElementById('b').onclick=function(){u.select();try{navigator.clipboard.writeText(u.value)}catch(e){document.execCommand('copy')}this.textContent='Đã copy';};
</script></body></html>
